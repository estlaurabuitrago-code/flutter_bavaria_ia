name: bavaria_ia
description: "Bavaria IA - Detección de objetos con cámara y TFLite"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  tflite_flutter: ^0.12.1
  permission_handler: ^11.3.1
  image: ^4.2.0
  supabase_flutter: ^2.0.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo_bavaria.png
    - assets/images/logo_liftscan.jpg
    - assets/models/buenito1.tflite
